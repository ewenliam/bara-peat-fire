<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bara: peat fire forecast and crew dispatch</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="/style.css" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="brand-mark" src="/brand/bara-mark-light.png" alt="" aria-hidden="true">
    <div>
      <h1 class="brand-name"><img src="/brand/bara-wordmark-light.png" alt="Bara"></h1>
      <div class="brand-sub">Peat fire forecast and crew dispatch, Sumatra and Kalimantan</div>
    </div>
  </div>
  <div class="day-controls" role="group" aria-label="Forecast date">
    <button class="icon-btn" id="prev-day" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <label class="date-field"><span>Forecast made on</span><input type="date" id="date" min="2019-01-08" max="2019-12-30"></label>
    <button class="icon-btn" id="next-day" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <button class="btn ghost replay-btn" id="replay-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l11-7z"/></svg>Replay 2019 season</button>
  <div class="spend" id="spend" title="Logged Meta API spend against the hard cap">Meta API <b>$0.00</b></div>
</header>

<main class="layout">
  <section class="map-wrap" aria-label="Fire map">
    <div id="map"></div>
    <div class="kpis" id="kpis"></div>
    <div class="legend">
      <div class="legend-row"><span class="dot p1"></span>P1 brigade now</div>
      <div class="legend-row"><span class="dot p2"></span>P2 village fire watch</div>
      <div class="legend-row"><span class="dot p3"></span>P3 monitor</div>
      <div class="legend-row"><span class="line-key"></span>Crew route, numbered stops</div>
      <div class="legend-row"><span class="ring new"></span>New-fire watch (11 km)</div>
      <div class="legend-row toggles">
        <label><input type="checkbox" id="show-p3"> Show P3</label>
        <label><input type="checkbox" id="show-truth"> What burned next day</label>
      </div>
    </div>
    <div class="loading" id="loading" hidden>Running Detect, Forecast, Triage, Dispatch...</div>
    <div class="replay-hud" id="replay-hud" hidden>
      <div class="hud-top">
        <button class="icon-btn" id="replay-play" aria-label="Play or pause"></button>
        <div class="hud-date" id="hud-date"></div>
        <div class="hud-tally" id="hud-tally"></div>
        <button class="btn ghost" id="replay-exit">Exit replay</button>
      </div>
      <svg class="hud-chart" id="hud-chart" viewBox="0 0 1000 90" preserveAspectRatio="none" aria-label="Daily next-day fire cells reached"></svg>
      <input type="range" id="replay-slider" min="0" value="0" aria-label="Replay day">
      <div class="hud-legend"><span class="key bara"></span>Bara crews (forecast + solver) <span class="key big"></span>Biggest fire first <span class="ring-key"></span>Fire the next day</div>
    </div>
  </section>

  <aside class="panel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="briefing" class="active">Briefing</button>
      <button role="tab" data-tab="crews">Crews</button>
      <button role="tab" data-tab="ask">Ask Bara</button>
      <button role="tab" data-tab="reports">Field reports</button>
      <button role="tab" data-tab="evidence">Evidence</button>
    </nav>
    <div class="tab-body" id="tab-briefing"></div>
    <div class="tab-body" id="tab-crews" hidden></div>
    <div class="tab-body" id="tab-ask" hidden></div>
    <div class="tab-body" id="tab-reports" hidden></div>
    <div class="tab-body" id="tab-evidence" hidden></div>
  </aside>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.0/dist.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
